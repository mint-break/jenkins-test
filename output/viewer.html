<meta charset="utf-8">
<title>Mint Stack Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one stage (canvas turntable) beside a narrow control rail; the slice strip runs underneath like a film strip. */
:root {
  --bg: #eef4f1;
  --panel: #ffffff;
  --fg: #1d2b25;
  --muted: #5d7068;
  --line: #d3e1db;
  --accent: #2f8f6a;
  --accent-soft: #d6efe4;
  --stage: #dfe9e4;
  --stage-grid: #cddcd5;
  --hl: #e8553d;
  --f-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --f-body: "M PLUS Rounded 1c", "Hiragino Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a17; --panel: #1a2420; --fg: #e3efe9; --muted: #93a8a0; --line: #2a3832;
    --accent: #6fd3a8; --accent-soft: #1f3a2f; --stage: #18221e; --stage-grid: #22302a; --hl: #ff7a5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a17; --panel: #1a2420; --fg: #e3efe9; --muted: #93a8a0; --line: #2a3832;
  --accent: #6fd3a8; --accent-soft: #1f3a2f; --stage: #18221e; --stage-grid: #22302a; --hl: #ff7a5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
@media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage {
  position: relative; border-radius: 14px; overflow: hidden; min-height: 420px;
  background: var(--stage);
  background-image: linear-gradient(var(--stage-grid) 1px, transparent 1px), linear-gradient(90deg, var(--stage-grid) 1px, transparent 1px);
  background-size: 24px 24px; touch-action: none; cursor: grab;
}
.stage:active { cursor: grabbing; }
canvas#view { display: block; width: 100%; height: 100%; image-rendering: pixelated; position: absolute; inset: 0; }
.angle {
  position: absolute; left: 12px; bottom: 10px; font-family: var(--f-mono); font-size: 12px;
  color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none;
}
.hint { position: absolute; right: 12px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.rail { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; align-content: start; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
.field output { font-family: var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.seg button { min-width: 0; overflow-wrap: anywhere; }
.seg button, .btn {
  font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); cursor: pointer; text-align: left;
}
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 800; }
.seg button small { display: block; color: var(--muted); font-weight: 500; font-family: var(--f-mono); font-size: 11px; }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.checks input { accent-color: var(--accent); width: 16px; height: 16px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.strip-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.strip-head h2 { font-family: var(--f-display); font-size: 1rem; margin: 0; }
.strip-head p { margin: 0; color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.strip-scroll { overflow-x: auto; padding-bottom: 6px; }
canvas#strip { display: block; image-rendering: pixelated; cursor: pointer; }
.file { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.file input[type=file] { font-size: 12px; max-width: 100%; }
.file .row { display: flex; gap: 8px; align-items: center; }
.file input[type=number] { width: 72px; font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1>Mint Stack Viewer</h1>
    <p class="sub">ボクセルの断面から作ったスライス帯を、そのまま重ねて回します</p>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="スプライトスタックのプレビュー。ドラッグで回転"></canvas>
      <div class="hint">ドラッグで回転 · ホイールで拡大</div>
      <div class="angle" id="angle">0°</div>
    </div>

    <aside class="rail">
      <div class="field">
        <span class="lbl">モデル</span>
        <div class="seg" id="models"></div>
      </div>
      <div class="field">
        <label for="pitch">見下ろし（縦の潰し） <output id="pitchOut"></output></label>
        <input type="range" id="pitch" min="0.2" max="1" step="0.01" value="0.6">
      </div>
      <div class="field">
        <label for="step">高さの倍率 <output id="stepOut"></output></label>
        <input type="range" id="step" min="0.5" max="2" step="0.05" value="1">
      </div>
      <div class="field">
        <label for="zoom">拡大 <output id="zoomOut"></output></label>
        <input type="range" id="zoom" min="2" max="12" step="1" value="6">
      </div>
      <div class="field">
        <label for="layer">強調する層 <output id="layerOut"></output></label>
        <input type="range" id="layer" min="-1" max="63" step="1" value="-1">
      </div>
      <div class="field">
        <label for="ridge">段の線 <output id="ridgeOut"></output></label>
        <input type="range" id="ridge" min="0" max="0.5" step="0.05" value="0.25">
      </div>
      <div class="checks">
        <label><input type="checkbox" id="spin" checked> 自動で回す</label>
        <label><input type="checkbox" id="lit"> ライティング（法線＋AO）</label>
        <label><input type="checkbox" id="pixel" checked> ドット絵表示（等倍で回して拡大）</label>
        <label><input type="checkbox" id="line" checked> 輪郭線</label>
      </div>
      <div class="file">
        <span class="lbl">自分のスライス帯を読み込む</span>
        <div class="row"><label for="nLayers">層数</label><input type="number" id="nLayers" min="1" max="512" value="32"></div>
        <input type="file" id="upload" accept="image/png,application/json" multiple>
        <span>PNGと同名の .json も一緒に選ぶと、層ごとの厚みを読み込みます</span>
      </div>
      <p class="note">層を強調すると、その層だけ赤くなります。回しても赤い層が本体からずれなければ、位置合わせは正しいです。</p>
    </aside>
  </div>

  <section class="strip">
    <div class="strip-head">
      <h2>スライス帯</h2>
      <p id="stripInfo"></p>
    </div>
    <div class="strip-scroll"><canvas id="strip" aria-label="スライス帯。クリックした層を強調"></canvas></div>
  </section>
</div>

<script>
const MODELS = [
  { id: "px-nb", name: "目標絵・パンなし", sub: "胴体9段＋葉", src: "pixel_input/no_bread/slices.png" },
  { id: "px-b", name: "目標絵・パンあり", sub: "胴体9段＋葉", src: "pixel_input/bread/slices.png" },
  { id: "or-nb", name: "元絵・パンなし", sub: "胴体9段＋葉", src: "tiers_no_bread/slices.png" },
  { id: "or-64", name: "元絵・パンなし", sub: "旧版 64層", src: "no_bread_64/slices.png", layers: 64 },
];

const $ = (id) => document.getElementById(id);
const view = $("view"), ctx = view.getContext("2d");
const off = document.createElement("canvas"), octx = off.getContext("2d");
const stripCv = $("strip"), sctx = stripCv.getContext("2d");
const state = { yaw: 0, model: null, spin: true, dragging: false, lastX: 0, lastT: 0, dirty: true };
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- model: strip (+ json) -> layers, plus a fine voxel grid for lighting ---------- */
function buildModel(img, meta, label) {
  const L = meta.layers, W = Math.floor(img.width / L), Z = img.height;
  const bottom = meta.layer_bottom || Array.from({ length: L }, (_, i) => i);
  const thick = meta.layer_thickness || Array.from({ length: L }, () => 1);
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const g = c.getContext("2d"); g.drawImage(img, 0, 0);
  const px = g.getImageData(0, 0, img.width, img.height).data;
  // layer arrays, indexed [i][z][x] with z = 0 at the character's front
  const N = L * Z * W, occ = new Uint8Array(N), rgb = new Uint8Array(N * 3);
  const li = (i, x, z) => (i * Z + z) * W + x;
  for (let i = 0; i < L; i++) for (let r = 0; r < Z; r++) for (let x = 0; x < W; x++) {
    const p = (r * img.width + i * W + x) * 4, k = li(i, x, Z - 1 - r);
    if (px[p + 3] > 127) { occ[k] = 1; rgb[k * 3] = px[p]; rgb[k * 3 + 1] = px[p + 1]; rgb[k * 3 + 2] = px[p + 2]; }
  }
  // fine grid: every layer repeated over its thickness
  const Y = Math.round(bottom[L - 1] + thick[L - 1]);
  const rowLayer = new Int32Array(Y).fill(-1);
  for (let i = 0; i < L; i++) for (let y = Math.round(bottom[i]); y < Math.round(bottom[i] + thick[i]); y++) rowLayer[y] = i;
  const fi = (x, y, z) => (y * Z + z) * W + x;
  const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= W || y >= Y || z >= Z || rowLayer[y] < 0) ? 0 : occ[li(rowLayer[y], x, z)];
  const blur = new Float32Array(W * Y * Z), ao = new Float32Array(W * Y * Z), nrm = new Float32Array(W * Y * Z * 3);
  for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) for (let x = 0; x < W; x++) {
    let s = 0, s5 = 0;
    for (let dy = -2; dy <= 2; dy++) for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
      const v = at(x + dx, y + dy, z + dz); s5 += v;
      if (dx > -2 && dx < 2 && dy > -2 && dy < 2 && dz > -2 && dz < 2) s += v;
    }
    blur[fi(x, y, z)] = s / 27; ao[fi(x, y, z)] = Math.min(1.15, Math.max(0.55, 1 - 1.1 * (s5 / 125 - 0.5)));
  }
  const bl = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= W || y >= Y || z >= Z) ? 0 : blur[fi(x, y, z)];
  for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) for (let x = 0; x < W; x++) {
    const i = fi(x, y, z);
    const nx = bl(x - 1, y, z) - bl(x + 1, y, z), ny = bl(x, y - 1, z) - bl(x, y + 1, z), nz = bl(x, y, z - 1) - bl(x, y, z + 1);
    const l = Math.hypot(nx, ny, nz) || 1; nrm[i * 3] = nx / l; nrm[i * 3 + 1] = ny / l; nrm[i * 3 + 2] = nz / l;
  }
  const mk = () => { const k = document.createElement("canvas"); k.width = W; k.height = Z; return k; };
  const canv = Array.from({ length: L }, () => ({ base: mk(), dark: mk(), light: mk() }));
  return { label, img, W, Z, L, Y, bottom, thick, occ, rgb, li, fi, nrm, ao, canv, hl: mk(), key: null };
}

/* recolour layers: lighting (light fixed to the camera) and the tier groove/rim tints */
function paintLayers(m, yawDeg, lit, ridge) {
  const key = `${lit ? Math.round(yawDeg) : "flat"}|${ridge}`;
  if (m.key === key) return; m.key = key;
  const a = -yawDeg * Math.PI / 180;
  let Lv = [-0.5, 0.75, -0.45]; const n = Math.hypot(...Lv); Lv = Lv.map(v => v / n);
  const Lx = Lv[0] * Math.cos(a) - Lv[2] * Math.sin(a), Lz = Lv[0] * Math.sin(a) + Lv[2] * Math.cos(a), Ly = Lv[1];
  const tones = { base: 1, dark: 1 - ridge, light: 1 + ridge * 0.4 };
  for (let i = 0; i < m.L; i++) {
    const fy = Math.min(m.Y - 1, Math.round(m.bottom[i] + (m.thick[i] - 1) / 2));
    for (const [name, tone] of Object.entries(tones)) {
      const cv = m.canv[i][name], g = cv.getContext("2d"), im = g.createImageData(m.W, m.Z), d = im.data;
      for (let r = 0; r < m.Z; r++) for (let x = 0; x < m.W; x++) {
        const z = m.Z - 1 - r, k = m.li(i, x, z), p = (r * m.W + x) * 4;
        if (!m.occ[k]) continue;
        let s = tone;
        if (lit) {
          const f = m.fi(x, fy, z);
          const dot = Math.max(0, m.nrm[f * 3] * Lx + m.nrm[f * 3 + 1] * Ly + m.nrm[f * 3 + 2] * Lz);
          s *= (0.45 + 0.65 * dot) * m.ao[f];
        }
        d[p] = Math.min(255, m.rgb[k * 3] * s); d[p + 1] = Math.min(255, m.rgb[k * 3 + 1] * s);
        d[p + 2] = Math.min(255, m.rgb[k * 3 + 2] * s); d[p + 3] = 255;
      }
      g.putImageData(im, 0, 0);
    }
  }
}

function paintHighlight(m, i) {
  const g = m.hl.getContext("2d"); g.clearRect(0, 0, m.W, m.Z);
  if (i < 0 || i >= m.L) return;
  g.drawImage(m.canv[i].base, 0, 0);
  g.globalCompositeOperation = "source-in"; g.fillStyle = cssVar("--hl") || "#e8553d";
  g.fillRect(0, 0, m.W, m.Z); g.globalCompositeOperation = "source-over";
}

function addOutline(cv, g) {
  const w = cv.width, h = cv.height, im = g.getImageData(0, 0, w, h), d = im.data, src = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = (y * w + x) * 4; if (src[p + 3]) continue;
    let q = -1;
    if (x > 0 && src[p - 4 + 3]) q = p - 4; else if (x < w - 1 && src[p + 4 + 3]) q = p + 4;
    else if (y > 0 && src[p - w * 4 + 3]) q = p - w * 4; else if (y < h - 1 && src[p + w * 4 + 3]) q = p + w * 4;
    if (q < 0) continue;
    d[p] = src[q] * 0.42; d[p + 1] = src[q + 1] * 0.42; d[p + 2] = src[q + 2] * 0.42; d[p + 3] = 255;
  }
  g.putImageData(im, 0, 0);
}

/* ---------- rendering: rotate each layer about the shared pivot, squash, draw it once per pixel of height ---------- */
function render() {
  const m = state.model; if (!m) return;
  const dpr = window.devicePixelRatio || 1, rect = view.getBoundingClientRect();
  const cw = Math.round(rect.width * dpr), ch = Math.round(rect.height * dpr);
  if (view.width !== cw || view.height !== ch) { view.width = cw; view.height = ch; }
  const zoomPx = Math.max(1, Math.round(+$("zoom").value * dpr * 64 / Math.max(m.Y, 64)));
  const pixel = $("pixel").checked, p = pixel ? 1 : zoomPx;
  const squash = +$("pitch").value, hmul = +$("step").value, ridge = +$("ridge").value;
  const hlLayer = +$("layer").value;
  paintLayers(m, state.yaw, $("lit").checked, ridge);
  paintHighlight(m, hlLayer);
  const diag = Math.ceil(Math.hypot(m.W, m.Z) * p) + 4;
  off.width = diag + 8; off.height = Math.ceil(diag * squash + m.Y * hmul * p) + 16;
  octx.clearRect(0, 0, off.width, off.height); octx.imageSmoothingEnabled = false;
  const bx = off.width / 2, by = off.height - 8 - diag * squash / 2, rad = state.yaw * Math.PI / 180;
  for (let i = 0; i < m.L; i++) {
    const base = Math.round(m.bottom[i] * hmul * p), t = Math.max(1, Math.round(m.thick[i] * hmul * p));
    const thick = m.thick[i] > 1;
    for (let k = 0; k < t; k++) {
      let src = m.canv[i].base;
      if (i === hlLayer) src = m.hl;
      else if (thick && ridge > 0 && k < p) src = m.canv[i].dark;
      else if (thick && ridge > 0 && k >= t - p) src = m.canv[i].light;
      octx.setTransform(1, 0, 0, squash, Math.round(bx), Math.round(by - base - k));
      octx.rotate(-rad);
      octx.drawImage(src, -m.W / 2 * p, -m.Z / 2 * p, m.W * p, m.Z * p);
    }
  }
  octx.setTransform(1, 0, 0, 1, 0, 0);
  if ($("line").checked) addOutline(off, octx);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cw, ch); ctx.imageSmoothingEnabled = false;
  const s = pixel ? zoomPx : 1, dw = off.width * s, dh = off.height * s;
  ctx.drawImage(off, Math.round((cw - dw) / 2), Math.round((ch - dh) / 2), dw, dh);
  $("angle").textContent = `${((state.yaw % 360) + 360) % 360 | 0}°  ·  ${m.W}×${m.Z} px × ${m.L} 層（高さ ${m.Y}）`;
}

function drawStrip() {
  const m = state.model; if (!m) return;
  const scale = Math.max(2, Math.min(5, Math.floor(1400 / m.img.width)));
  stripCv.width = m.img.width * scale; stripCv.height = m.img.height * scale + 14;
  stripCv.style.width = stripCv.width + "px";
  sctx.imageSmoothingEnabled = false; sctx.clearRect(0, 0, stripCv.width, stripCv.height);
  sctx.drawImage(m.img, 0, 0, stripCv.width, m.img.height * scale);
  sctx.strokeStyle = cssVar("--line"); sctx.lineWidth = 1;
  sctx.fillStyle = cssVar("--muted"); sctx.font = "10px JetBrains Mono, monospace";
  for (let i = 0; i < m.L; i++) {
    const x0 = i * m.W * scale;
    sctx.strokeRect(x0 + 0.5, 0.5, m.W * scale - 1, m.Z * scale - 1);
    if (m.L <= 32 || i % 4 === 0) sctx.fillText(m.thick[i] > 1 ? `${i}·${m.thick[i]}` : String(i), x0 + 2, m.Z * scale + 11);
  }
  const hl = +$("layer").value;
  if (hl >= 0 && hl < m.L) {
    sctx.strokeStyle = cssVar("--hl"); sctx.lineWidth = 2;
    sctx.strokeRect(hl * m.W * scale + 1, 1, m.W * scale - 2, m.Z * scale - 2);
  }
  $("stripInfo").textContent = `${m.label} · 左が地面側 · 番号·厚み（ボクセル）· 各層は上から見た図（下端が正面）`;
  stripCv.dataset.scale = scale;
}

/* ---------- loading ---------- */
const loadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
async function selectModel(def, metaOverride) {
  try {
    const img = await loadImage(def.src);
    let meta = metaOverride;
    if (!meta) {
      try { const r = await fetch(def.src.replace(/\.png$/, ".json")); if (r.ok) meta = await r.json(); } catch (_) {}
    }
    if (!meta || !meta.layers) meta = { layers: def.layers || 32 };
    state.model = buildModel(img, meta, `${def.name} ${def.sub}`.trim());
  } catch (e) { $("stripInfo").textContent = `${def.src} を読み込めませんでした`; return; }
  $("layer").max = state.model.L - 1;
  if (+$("layer").value > state.model.L - 1) $("layer").value = -1;
  document.querySelectorAll("#models button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === def.id));
  syncOutputs(); drawStrip(); state.dirty = true;
}

MODELS.forEach(def => {
  const b = document.createElement("button"); b.type = "button"; b.id = "model-" + def.id; b.dataset.id = def.id;
  b.innerHTML = `${def.name}<small>${def.sub}</small>`; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => selectModel(def)); $("models").appendChild(b);
});

$("upload").addEventListener("change", async (e) => {
  const files = [...e.target.files], png = files.find(f => f.type === "image/png" || /\.png$/i.test(f.name));
  if (!png) return;
  let meta = null; const js = files.find(f => /\.json$/i.test(f.name));
  if (js) { try { meta = JSON.parse(await js.text()); } catch (_) {} }
  if (!meta) meta = { layers: Math.max(1, +$("nLayers").value || 32) };
  await selectModel({ id: "custom", name: png.name, sub: "", src: URL.createObjectURL(png) }, meta);
});

/* ---------- controls ---------- */
function syncOutputs() {
  $("pitchOut").textContent = (+$("pitch").value).toFixed(2);
  $("stepOut").textContent = "×" + (+$("step").value).toFixed(2);
  $("zoomOut").textContent = "×" + $("zoom").value;
  $("ridgeOut").textContent = (+$("ridge").value).toFixed(2);
  const l = +$("layer").value; $("layerOut").textContent = l < 0 ? "なし" : `${l} 層目`;
}
["pitch", "step", "zoom", "ridge", "lit", "pixel", "line"].forEach(id => $(id).addEventListener("input", () => { syncOutputs(); state.dirty = true; }));
$("layer").addEventListener("input", () => { syncOutputs(); drawStrip(); state.dirty = true; });
$("spin").addEventListener("change", () => { state.spin = $("spin").checked; });
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { $("spin").checked = false; state.spin = false; }

stripCv.addEventListener("click", (e) => {
  const m = state.model; if (!m) return;
  const r = stripCv.getBoundingClientRect(), sc = +stripCv.dataset.scale;
  const i = Math.floor((e.clientX - r.left) / (m.W * sc));
  $("layer").value = (+$("layer").value === i) ? -1 : i; syncOutputs(); drawStrip(); state.dirty = true;
});

const stage = $("stage");
stage.addEventListener("pointerdown", (e) => { state.dragging = true; state.lastX = e.clientX; stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove", (e) => { if (!state.dragging) return; state.yaw += (e.clientX - state.lastX) * 0.6; state.lastX = e.clientX; state.dirty = true; });
const endDrag = () => { state.dragging = false; };
stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("wheel", (e) => {
  e.preventDefault(); const z = $("zoom");
  z.value = Math.min(+z.max, Math.max(+z.min, +z.value + (e.deltaY < 0 ? 1 : -1))); syncOutputs(); state.dirty = true;
}, { passive: false });
window.addEventListener("resize", () => { state.dirty = true; });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { drawStrip(); state.dirty = true; });

let lastDraw = 0;
function tick(t) {
  const dt = state.lastT ? (t - state.lastT) / 1000 : 0; state.lastT = t;
  if (state.spin && !state.dragging) { state.yaw += dt * 40; state.dirty = true; }
  if (state.dirty && t - lastDraw > 30) { render(); state.dirty = false; lastDraw = t; }
  requestAnimationFrame(tick);
}
syncOutputs();
selectModel(MODELS[0]);
requestAnimationFrame(tick);
</script>
